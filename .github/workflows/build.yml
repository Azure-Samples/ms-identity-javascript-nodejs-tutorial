# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}

    - run: |
        cd Common/msal-node-wrapper
        npm ci
        npm audit --omit=dev
        npm run build --if-present
        npm run test

    - run: |
        cd 1-Authentication/1-sign-in/App
        npm install
        npm audit --omit=dev
        npm run test

    - run: |
        cd 1-Authentication/2-sign-in-b2c/App
        npm install
        npm audit --omit=dev
        npm run test

    - run: |
        cd 2-Authorization/1-call-graph/App
        npm install
        npm audit --omit=dev
        npm run test

    - run: |
        cd 4-AccessControl/1-app-roles/App
        npm install
        npm audit --omit=dev
        npm run test

    - run: |
        cd 4-AccessControl/2-security-groups/App
        npm install
        npm audit --omit=dev
        npm run test